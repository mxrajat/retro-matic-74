<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#18181b" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>CRAFT-CAM // Lo-Fi Pixel Camera</title>
  <link rel="manifest" href="manifest.json" />
  <style>
    :root {
      --bg-dark: #161618;
      --stone-base: #8b8b8b;
      --stone-light: #ffffff;
      --stone-dark: #373737;
      --slot-bg: #3b3b3b;
      --mc-green: #3c8527;
      --mc-green-light: #52a535;
      --mc-red: #b82525;
      --mc-red-light: #e03c3c;
      --mc-gold: #ffaa00;
      --mc-yellow: #ffff55;
      --mc-white: #ffffff;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      margin: 0;
      padding: 0;
      image-rendering: pixelated;
    }

    body {
      background-color: #0e0e10;
      /* Subtle Minecraft Deepslate block texture */
      background-image:
        linear-gradient(45deg, #141417 25%, transparent 25%),
        linear-gradient(-45deg, #141417 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #141417 75%),
        linear-gradient(-45deg, transparent 75%, #141417 75%);
      background-size: 16px 16px;
      background-position: 0 0, 0 8px, 8px -8px, -8px 0;
      color: var(--mc-white);
      font-family: 'Courier New', Courier, monospace;
      font-weight: 900;
      height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .app-shell {
      width: 100%;
      max-width: 440px;
      height: 100dvh;
      padding: 12px 14px 18px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background-color: #26262a;
      border-left: 4px solid #000;
      border-right: 4px solid #000;
      box-shadow: inset 0 0 0 4px #45454d;
    }

    /* Classic Minecraft 3D Beveled Button */
    .mc-btn {
      background-color: var(--stone-base);
      border: 3px solid #000;
      box-shadow:
        inset 3px 3px 0px var(--stone-light),
        inset -3px -3px 0px var(--stone-dark);
      color: #fff;
      text-shadow: 2px 2px 0px #222;
      font-family: inherit;
      font-weight: 900;
      font-size: 0.78rem;
      letter-spacing: 0.5px;
      padding: 8px 10px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      position: relative;
    }

    .mc-btn:active {
      box-shadow:
        inset 3px 3px 0px var(--stone-dark),
        inset -3px -3px 0px var(--stone-light);
      transform: translateY(2px);
    }

    .mc-btn.active {
      background-color: var(--mc-green);
      box-shadow:
        inset 3px 3px 0px #76cc56,
        inset -3px -3px 0px #235216;
      color: var(--mc-yellow);
    }

    /* Top Minimal Bar */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
      background: #1a1a1d;
      border: 3px solid #000;
      box-shadow: inset 2px 2px 0 #3a3a40, inset -2px -2px 0 #0c0c0e;
      padding: 8px;
    }

    .mini-controls {
      display: flex;
      gap: 6px;
      width: 100%;
      justify-content: space-between;
    }

    .mini-btn {
      flex: 1;
      padding: 9px 4px;
      font-size: 0.72rem;
      white-space: nowrap;
    }

    /* Viewfinder Frame (Minecraft Item Frame / GUI Slot) */
    .viewfinder-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 3 / 4;
      max-height: 62dvh;
      background: #000;
      border: 4px solid #000;
      box-shadow:
        inset 4px 4px 0px #373737,
        inset -4px -4px 0px #ffffff,
        0 6px 0px rgba(0,0,0,0.6);
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    video#videoEl {
      display: none;
    }

    #viewfinderCanvas {
      width: 100%;
      height: 100%;
      object-fit: cover;
      image-rendering: pixelated;
    }

    /* Minecraft Crosshair in Center */
    .mc-crosshair {
      position: absolute;
      width: 22px;
      height: 22px;
      pointer-events: none;
      opacity: 0.75;
      mix-blend-mode: difference;
    }
    .mc-crosshair::before,
    .mc-crosshair::after {
      content: '';
      position: absolute;
      background: #ffffff;
    }
    .mc-crosshair::before {
      width: 22px;
      height: 3px;
      top: 9.5px;
      left: 0;
    }
    .mc-crosshair::after {
      width: 3px;
      height: 22px;
      top: 0;
      left: 9.5px;
    }

    /* Top-left HUD badge inside viewfinder */
    .hud-tag {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(0, 0, 0, 0.65);
      border: 2px solid #000;
      padding: 4px 8px;
      font-size: 0.7rem;
      color: var(--mc-yellow);
      text-shadow: 2px 2px 0 #000;
      pointer-events: none;
    }

    /* Recording Timer Badge */
    .rec-hud {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(180, 0, 0, 0.85);
      border: 2px solid #000;
      padding: 4px 8px;
      font-size: 0.75rem;
      color: #fff;
      text-shadow: 2px 2px 0 #000;
      display: none;
      align-items: center;
      gap: 6px;
      pointer-events: none;
    }

    .rec-hud.active {
      display: flex;
    }

    .rec-pixel {
      width: 8px;
      height: 8px;
      background: #ffff55;
      animation: blink 0.6s steps(2, start) infinite;
    }

    @keyframes blink {
      to { visibility: hidden; }
    }

    /* Toast Notification inside Viewfinder ("SAVED!") */
    .save-toast {
      position: absolute;
      bottom: 14px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(20, 20, 20, 0.9);
      border: 3px solid #000;
      box-shadow: inset 2px 2px 0 #55ff55, inset -2px -2px 0 #1b661b;
      color: #55ff55;
      text-shadow: 2px 2px 0 #000;
      padding: 6px 14px;
      font-size: 0.78rem;
      opacity: 0;
      transition: opacity 0.2s;
      pointer-events: none;
      z-index: 15;
      white-space: nowrap;
    }

    .save-toast.show {
      opacity: 1;
    }

    /* White Screen Flash */
    .flash-layer {
      position: absolute;
      inset: 0;
      background: #ffffff;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
      z-index: 12;
    }

    /* Bottom Dock (Minecraft Hotbar Style) */
    .bottom-dock {
      display: flex;
      flex-direction: column;
      gap: 12px;
      align-items: center;
    }

    /* Simple Photo / Video Toggle */
    .mode-bar {
      display: flex;
      gap: 8px;
      width: 100%;
      max-width: 260px;
    }

    .mode-tab {
      flex: 1;
      padding: 8px;
      font-size: 0.78rem;
    }

    /* Main Shutter Row */
    .shutter-row {
      width: 100%;
      display: flex;
      justify-content: space-around;
      align-items: center;
      background: #1a1a1d;
      border: 3px solid #000;
      box-shadow: inset 2px 2px 0 #3a3a40, inset -2px -2px 0 #0c0c0e;
      padding: 12px 16px;
    }

    /* Inventory Slot Thumbnail */
    .inv-slot {
      width: 64px;
      height: 64px;
      background: #3b3b3b;
      border: 3px solid #000;
      box-shadow:
        inset 3px 3px 0px #222222,
        inset -3px -3px 0px #999999;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      cursor: pointer;
      position: relative;
    }

    .inv-slot img,
    .inv-slot video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
    }

    .inv-slot span {
      font-size: 0.6rem;
      color: #aaa;
      text-align: center;
      text-shadow: 1px 1px 0 #000;
    }

    /* BIG BLOCKY SHUTTER BUTTON */
    .big-shutter {
      width: 96px;
      height: 96px;
      background-color: var(--mc-red-light);
      border: 4px solid #000;
      box-shadow:
        inset 5px 5px 0px #ff8a8a,
        inset -5px -5px 0px #7a1111,
        0 6px 0px #000;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: #fff;
      text-shadow: 2px 2px 0 #000;
      font-family: inherit;
      font-weight: 900;
      font-size: 0.9rem;
      transition: transform 0.06s;
    }

    .big-shutter:active {
      transform: translateY(4px);
      box-shadow:
        inset 5px 5px 0px #7a1111,
        inset -5px -5px 0px #ff8a8a,
        0 2px 0px #000;
    }

    .big-shutter.recording {
      background-color: var(--mc-gold);
      box-shadow:
        inset 5px 5px 0px #ffe07d,
        inset -5px -5px 0px #995c00,
        0 4px 0px #000;
      color: #000;
      text-shadow: none;
    }

    .shutter-icon {
      width: 28px;
      height: 28px;
      background: #fff;
      border: 3px solid #000;
      margin-bottom: 4px;
    }

    .big-shutter.recording .shutter-icon {
      background: #b82525;
    }

    /* Right Side Counter Box */
    .stat-slot {
      width: 64px;
      height: 64px;
      background: #141416;
      border: 3px solid #000;
      box-shadow:
        inset 3px 3px 0px #08080a,
        inset -3px -3px 0px #444;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 4px;
    }

    .stat-label {
      font-size: 0.55rem;
      color: #aaa;
    }

    .stat-num {
      font-size: 1.05rem;
      color: var(--mc-yellow);
      text-shadow: 2px 2px 0 #000;
    }

    /* Fullscreen Preview Modal */
    .preview-modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.92);
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 18px;
      z-index: 100;
      gap: 14px;
    }

    .preview-modal img,
    .preview-modal video {
      max-width: 92%;
      max-height: 72dvh;
      border: 4px solid #000;
      box-shadow: 0 0 0 4px #8b8b8b;
      background: #000;
    }
  </style>
</head>
<body>

  <div class="app-shell">
    <!-- Top Compact Minecraft Utility Row -->
    <div class="top-bar">
      <div class="mini-controls">
        <button class="mc-btn mini-btn" id="flashBtn" title="Flashlight">⚡ FLASH</button>
        <button class="mc-btn mini-btn" id="wideBtn" title="Wide Angle">📐 1.0x</button>
        <button class="mc-btn mini-btn active" id="dateBtn" title="Live Date & Time">🕒 TIME</button>
        <button class="mc-btn mini-btn" id="flipBtn" title="Switch Camera">🔄 FLIP</button>
      </div>
    </div>

    <!-- Center Pixelated Viewfinder -->
    <div class="viewfinder-wrap">
      <video id="videoEl" autoplay playsinline muted></video>
      <canvas id="viewfinderCanvas"></canvas>

      <div class="mc-crosshair"></div>
      <div class="hud-tag" id="hudTag">LO-FI 360P • 1.0x</div>

      <div class="rec-hud" id="recHud">
        <div class="rec-pixel"></div>
        <span id="recTimer">00:00</span>
      </div>

      <div class="save-toast" id="saveToast">SAVED TO PHONE!</div>
      <div class="flash-layer" id="flashLayer"></div>
    </div>

    <!-- Bottom Minecraft Controls -->
    <div class="bottom-dock">
      <div class="mode-bar">
        <button class="mc-btn mode-tab active" id="modePhotoBtn">[ PHOTO ]</button>
        <button class="mc-btn mode-tab" id="modeVideoBtn">[ VIDEO ]</button>
      </div>

      <div class="shutter-row">
        <!-- Last Shot Slot -->
        <div class="inv-slot" id="invSlot" title="Preview Last Saved">
          <img id="thumbImg" alt="Last Photo" />
          <video id="thumbVid" muted loop playsinline></video>
          <span id="slotEmptyText">EMPTY<br>SLOT</span>
        </div>

        <!-- Giant Blocky Shutter Button -->
        <button class="big-shutter" id="shutterBtn" aria-label="Capture">
          <div class="shutter-icon"></div>
          <span id="shutterLabel">SNAP</span>
        </button>

        <!-- Shot Counter Slot -->
        <div class="stat-slot">
          <span class="stat-label">SAVED</span>
          <span class="stat-num" id="shotCountEl">00</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Preview Modal -->
  <div class="preview-modal" id="previewModal">
    <img id="modalImg" alt="Preview" style="display:none;" />
    <video id="modalVid" controls autoplay loop playsinline style="display:none;"></video>
    <button class="mc-btn" id="closeModalBtn" style="padding: 12px 28px; font-size: 0.9rem;">[ CLOSE ]</button>
  </div>

  <script>
    const video = document.getElementById('videoEl');
    const canvas = document.getElementById('viewfinderCanvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });

    const flashBtn = document.getElementById('flashBtn');
    const wideBtn = document.getElementById('wideBtn');
    const dateBtn = document.getElementById('dateBtn');
    const flipBtn = document.getElementById('flipBtn');
    const hudTag = document.getElementById('hudTag');
    const recHud = document.getElementById('recHud');
    const recTimer = document.getElementById('recTimer');
    const saveToast = document.getElementById('saveToast');
    const flashLayer = document.getElementById('flashLayer');

    const modePhotoBtn = document.getElementById('modePhotoBtn');
    const modeVideoBtn = document.getElementById('modeVideoBtn');
    const shutterBtn = document.getElementById('shutterBtn');
    const shutterLabel = document.getElementById('shutterLabel');
    const shotCountEl = document.getElementById('shotCountEl');

    const invSlot = document.getElementById('invSlot');
    const thumbImg = document.getElementById('thumbImg');
    const thumbVid = document.getElementById('thumbVid');
    const slotEmptyText = document.getElementById('slotEmptyText');

    const previewModal = document.getElementById('previewModal');
    const modalImg = document.getElementById('modalImg');
    const modalVid = document.getElementById('modalVid');
    const closeModalBtn = document.getElementById('closeModalBtn');

    // Fixed Low-Quality Gen-Z Aesthetic Resolution (270 x 360 portrait)
    const CAM_W = 270;
    const CAM_H = 360;
    canvas.width = CAM_W;
    canvas.height = CAM_H;

    let captureMode = 'photo'; // 'photo' | 'video'
    let facingMode = 'environment';
    let flashOn = false;
    let wideAngleOn = false; // false = 1.0x, true = 0.5x Wide
    let showDateTime = true;

    let stream = null;
    let audioStream = null;
    let shotCount = 0;
    let isRecording = false;
    let mediaRecorder = null;
    let recordedChunks = [];
    let recStart = 0;
    let recInterval = null;

    let lastMediaUrl = null;
    let lastMediaType = 'photo';

    // Minecraft UI Click Sound Synthesizer
    function playMcClick(pitch = 900) {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        const ac = new AudioCtx();
        const osc = ac.createOscillator();
        const gain = ac.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(pitch, ac.currentTime);
        osc.frequency.exponentialRampToValueAtTime(pitch * 0.4, ac.currentTime + 0.045);
        gain.gain.setValueAtTime(0.18, ac.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + 0.045);
        osc.connect(gain);
        gain.connect(ac.destination);
        osc.start();
        osc.stop(ac.currentTime + 0.05);
      } catch (e) {}
    }

    function showToast(msg) {
      saveToast.textContent = msg;
      saveToast.classList.add('show');
      setTimeout(() => saveToast.classList.remove('show'), 1800);
    }

    // Apply Hardware Torch (Flashlight) & Hardware Zoom if supported by phone lens
    async function applyHardwareConstraints() {
      if (!stream) return;
      const track = stream.getVideoTracks()[0];
      if (!track || !track.getCapabilities) return;

      const caps = track.getCapabilities();
      const adv = {};

      if ('torch' in caps) {
        adv.torch = flashOn;
      }

      if ('zoom' in caps) {
        const minZ = caps.zoom.min || 1;
        const maxZ = caps.zoom.max || 1;
        // If phone supports <1 zoom (ultra-wide), use it for 0.5x; otherwise use 1.0 for wide and 1.25 for normal
        if (minZ < 1) {
          adv.zoom = wideAngleOn ? minZ : 1;
        } else if (maxZ >= 1.25) {
          adv.zoom = wideAngleOn ? 1.0 : 1.25;
        }
      }

      try {
        await track.applyConstraints({ advanced: [adv] });
      } catch (e) {}
    }

    // Start Camera Directly (Auto-retries every 1s if user is still accepting Android permission popup)
    async function startCamera() {
      if (stream) {
        stream.getTracks().forEach(t => t.stop());
      }

      try {
        // Check if phone has dedicated ultra-wide camera when wideAngleOn is true
        let constraints = {
          video: {
            facingMode: facingMode,
            width: { ideal: 1280 },
            height: { ideal: 960 }
          },
          audio: false
        };

        stream = await navigator.mediaDevices.getUserMedia(constraints);
        video.srcObject = stream;
        await video.play();
        await applyHardwareConstraints();
      } catch (err) {
        // Keep retrying automatically in case Android runtime permission dialog is open
        setTimeout(startCamera, 1000);
      }
    }

    // Format Live Date & Time ("16/10/2026 03:18:45 PM")
    function getLiveDateTimeString() {
      const now = new Date();
      const dd = String(now.getDate()).padStart(2, '0');
      const mm = String(now.getMonth() + 1).padStart(2, '0');
      const yyyy = now.getFullYear();
      let hh = now.getHours();
      const ampm = hh >= 12 ? 'PM' : 'AM';
      hh = hh % 12 || 12;
      const hhStr = String(hh).padStart(2, '0');
      const minStr = String(now.getMinutes()).padStart(2, '0');
      const secStr = String(now.getSeconds()).padStart(2, '0');
      return `${dd}/${mm}/${yyyy} ${hhStr}:${minStr}:${secStr} ${ampm}`;
    }

    // Single Signature Gen-Z Low-Quality Filter + Wide Angle Crop + Live Date/Time
    function renderLoFiFrame() {
      if (video.readyState < 2) return;

      ctx.imageSmoothingEnabled = false;
      ctx.save();

      if (facingMode === 'user') {
        ctx.translate(CAM_W, 0);
        ctx.scale(-1, 1);
      }

      const vw = video.videoWidth || 640;
      const vh = video.videoHeight || 480;
      const targetAspect = CAM_W / CAM_H; // 3:4
      const srcAspect = vw / vh;

      let sx = 0, sy = 0, sw = vw, sh = vh;
      if (srcAspect > targetAspect) {
        sw = vh * targetAspect;
        sx = (vw - sw) / 2;
      } else {
        sh = vw / targetAspect;
        sy = (vh - sh) / 2;
      }

      // Software FOV adjustment: 1.0x crops slightly tighter (82% center), 0.5x uses 100% full wide sensor
      if (!wideAngleOn) {
        const cropFactor = 0.80;
        const newSw = sw * cropFactor;
        const newSh = sh * cropFactor;
        sx += (sw - newSw) / 2;
        sy += (sh - newSh) / 2;
        sw = newSw;
        sh = newSh;
      }

      ctx.drawImage(video, sx, sy, sw, sh, 0, 0, CAM_W, CAM_H);
      ctx.restore();

      // Apply Signature Gen-Z Aesthetic Lo-Fi Color Grade + Subtle Chromatic Shift + Grain
      const imgData = ctx.getImageData(0, 0, CAM_W, CAM_H);
      const d = imgData.data;
      const copy = new Uint8ClampedArray(d);

      for (let i = 0; i < d.length; i += 4) {
        // 2-pixel RGB shift for lo-fi digicam lens feel
        const shiftIdx = i + 8;
        let r = shiftIdx < d.length ? copy[shiftIdx] : copy[i];
        let g = copy[i + 1];
        let b = copy[i + 2];

        // Warm nostalgic low-fi curve with lifted shadows
        r = Math.min(255, ((r / 255 - 0.5) * 1.18 + 0.5) * 255 + 14);
        g = Math.min(255, ((g / 255 - 0.5) * 1.14 + 0.5) * 255 + 7);
        b = Math.max(0,   ((b / 255 - 0.5) * 1.08 + 0.5) * 255 + 4);

        // Organic lo-fi sensor grain
        const grain = (Math.random() - 0.5) * 26;
        d[i]     = Math.min(255, Math.max(0, r + grain));
        d[i + 1] = Math.min(255, Math.max(0, g + grain));
        d[i + 2] = Math.min(255, Math.max(0, b + grain));
      }
      ctx.putImageData(imgData, 0, 0);

      // Subtle dark corner vignette
      const grad = ctx.createRadialGradient(
        CAM_W / 2, CAM_H / 2, CAM_W * 0.35,
        CAM_W / 2, CAM_H / 2, CAM_H * 0.65
      );
      grad.addColorStop(0, 'rgba(0,0,0,0)');
      grad.addColorStop(1, 'rgba(0,0,0,0.52)');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, CAM_W, CAM_H);

      // Stamp Live Date & Time if enabled
      if (showDateTime) {
        const stamp = getLiveDateTimeString();
        ctx.font = 'bold 11px "Courier New", monospace';
        ctx.textAlign = 'right';
        // Pixelated black shadow
        ctx.fillStyle = '#000000';
        ctx.fillText(stamp, CAM_W - 7, CAM_H - 9);
        ctx.fillStyle = '#ffff55';
        ctx.fillText(stamp, CAM_W - 8, CAM_H - 10);
      }
    }

    // 18 FPS Retro Loop
    let lastTick = 0;
    function renderLoop(ts) {
      if (ts - lastTick > 55) {
        renderLoFiFrame();
        lastTick = ts;
      }
      requestAnimationFrame(renderLoop);
    }

    // Save directly to Android Phone Gallery (via Native Bridge) + Browser Fallback
    function autoSaveMediaToPhone(dataUrlOrBlob, filename, isVideo = false) {
      if (!isVideo) {
        // Photo: dataUrl string
        if (window.AndroidGallery && window.AndroidGallery.savePhoto) {
          window.AndroidGallery.savePhoto(dataUrlOrBlob, filename);
          showToast('SAVED TO GALLERY!');
          return;
        }
        const a = document.createElement('a');
        a.href = dataUrlOrBlob;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        showToast('PHOTO SAVED!');
      } else {
        // Video: Blob object
        if (window.AndroidGallery && window.AndroidGallery.saveVideo) {
          const reader = new FileReader();
          reader.onloadend = () => {
            window.AndroidGallery.saveVideo(reader.result, filename);
            showToast('VIDEO SAVED TO GALLERY!');
          };
          reader.readAsDataURL(dataUrlOrBlob);
          return;
        }
        const url = URL.createObjectURL(dataUrlOrBlob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        showToast('VIDEO SAVED!');
      }
    }

    // Capture Photo
    function snapPhoto() {
      playMcClick(750);

      // Screen flash effect (stronger if flash is ON)
      flashLayer.style.opacity = flashOn ? '1' : '0.65';
      setTimeout(() => { flashLayer.style.opacity = '0'; }, flashOn ? 220 : 90);

      renderLoFiFrame();

      // Low-quality crunchy JPEG compression (0.62)
      const dataUrl = canvas.toDataURL('image/jpeg', 0.62);
      const filename = `CRAFTCAM_${Date.now()}.jpg`;

      shotCount++;
      shotCountEl.textContent = String(shotCount).padStart(2, '0');

      lastMediaUrl = dataUrl;
      lastMediaType = 'photo';
      thumbVid.style.display = 'none';
      thumbImg.src = dataUrl;
      thumbImg.style.display = 'block';
      slotEmptyText.style.display = 'none';

      autoSaveMediaToPhone(dataUrl, filename, false);
    }

    // Toggle Video Recording
    async function toggleVideo() {
      if (!isRecording) {
        playMcClick(600);
        recordedChunks = [];

        const canvasStream = canvas.captureStream(18);
        const tracks = [...canvasStream.getVideoTracks()];

        try {
          if (!audioStream || !audioStream.active) {
            audioStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
          }
          if (audioStream && audioStream.getAudioTracks().length > 0) {
            tracks.push(audioStream.getAudioTracks()[0]);
          }
        } catch (e) {}

        const combined = new MediaStream(tracks);
        let mime = 'video/webm';
        if (window.MediaRecorder) {
          if (MediaRecorder.isTypeSupported('video/mp4')) mime = 'video/mp4';
          else if (MediaRecorder.isTypeSupported('video/webm;codecs=vp8,opus')) mime = 'video/webm;codecs=vp8,opus';
        }

        try {
          mediaRecorder = new MediaRecorder(combined, { mimeType: mime, videoBitsPerSecond: 600000 });
        } catch (e) {
          mediaRecorder = new MediaRecorder(combined);
        }

        mediaRecorder.ondataavailable = (ev) => {
          if (ev.data && ev.data.size > 0) recordedChunks.push(ev.data);
        };

        mediaRecorder.onstop = () => {
          const actualMime = mediaRecorder.mimeType || 'video/webm';
          const ext = actualMime.includes('mp4') ? 'mp4' : 'webm';
          const blob = new Blob(recordedChunks, { type: actualMime });
          const filename = `CRAFTCAM_VID_${Date.now()}.${ext}`;

          if (lastMediaUrl && lastMediaType === 'video') URL.revokeObjectURL(lastMediaUrl);
          lastMediaUrl = URL.createObjectURL(blob);
          lastMediaType = 'video';

          shotCount++;
          shotCountEl.textContent = String(shotCount).padStart(2, '0');

          thumbImg.style.display = 'none';
          thumbVid.src = lastMediaUrl;
          thumbVid.style.display = 'block';
          thumbVid.play().catch(() => {});
          slotEmptyText.style.display = 'none';

          autoSaveMediaToPhone(blob, filename, true);
        };

        mediaRecorder.start(200);
        isRecording = true;
        shutterBtn.classList.add('recording');
        shutterLabel.textContent = 'STOP';
        recHud.classList.add('active');
        recStart = Date.now();
        recTimer.textContent = '00:00';

        recInterval = setInterval(() => {
          const sec = Math.floor((Date.now() - recStart) / 1000);
          const m = String(Math.floor(sec / 60)).padStart(2, '0');
          const s = String(sec % 60).padStart(2, '0');
          recTimer.textContent = `${m}:${s}`;
        }, 500);
      } else {
        playMcClick(450);
        isRecording = false;
        shutterBtn.classList.remove('recording');
        shutterLabel.textContent = 'REC';
        recHud.classList.remove('active');
        clearInterval(recInterval);
        if (mediaRecorder && mediaRecorder.state !== 'inactive') {
          mediaRecorder.stop();
        }
      }
    }

    // Event Listeners
    shutterBtn.addEventListener('click', () => {
      if (captureMode === 'photo') snapPhoto();
      else toggleVideo();
    });

    flashBtn.addEventListener('click', () => {
      playMcClick(1000);
      flashOn = !flashOn;
      flashBtn.classList.toggle('active', flashOn);
      flashBtn.textContent = flashOn ? '⚡ ON' : '⚡ FLASH';
      applyHardwareConstraints();
    });

    wideBtn.addEventListener('click', () => {
      playMcClick(1000);
      wideAngleOn = !wideAngleOn;
      wideBtn.classList.toggle('active', wideAngleOn);
      wideBtn.textContent = wideAngleOn ? '📐 0.5x' : '📐 1.0x';
      hudTag.textContent = `LO-FI 360P • ${wideAngleOn ? '0.5x WIDE' : '1.0x'}`;
      applyHardwareConstraints();
    });

    dateBtn.addEventListener('click', () => {
      playMcClick(1000);
      showDateTime = !showDateTime;
      dateBtn.classList.toggle('active', showDateTime);
    });

    flipBtn.addEventListener('click', () => {
      playMcClick(850);
      facingMode = facingMode === 'environment' ? 'user' : 'environment';
      startCamera();
    });

    modePhotoBtn.addEventListener('click', () => {
      if (isRecording) toggleVideo();
      playMcClick(950);
      captureMode = 'photo';
      modePhotoBtn.classList.add('active');
      modeVideoBtn.classList.remove('active');
      shutterLabel.textContent = 'SNAP';
    });

    modeVideoBtn.addEventListener('click', () => {
      playMcClick(950);
      captureMode = 'video';
      modeVideoBtn.classList.add('active');
      modePhotoBtn.classList.remove('active');
      shutterLabel.textContent = 'REC';
    });

    invSlot.addEventListener('click', () => {
      if (!lastMediaUrl) return;
      playMcClick(800);
      if (lastMediaType === 'photo') {
        modalVid.pause();
        modalVid.style.display = 'none';
        modalImg.src = lastMediaUrl;
        modalImg.style.display = 'block';
      } else {
        modalImg.style.display = 'none';
        modalVid.src = lastMediaUrl;
        modalVid.style.display = 'block';
        modalVid.play().catch(() => {});
      }
      previewModal.style.display = 'flex';
    });

    closeModalBtn.addEventListener('click', () => {
      playMcClick(700);
      modalVid.pause();
      previewModal.style.display = 'none';
    });

    // Expose callback so Android MainActivity can trigger immediate camera start right after permission grant
    window.onAndroidPermissionsGranted = () => {
      startCamera();
    };

    // Boot directly into live camera
    startCamera();
    requestAnimationFrame(renderLoop);
  </script>
</body>
</html>
